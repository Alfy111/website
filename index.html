<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123f50" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Volume Should Be Turned Down" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/volume-alert.svg?v=2" />
    <link rel="apple-touch-icon" href="/icons/volume-alert-192.png" />
    <title>Volume Should Be Turned Down</title>
  </head>
  <body>
    <main class="chat-shell">
      <section id="pin-panel" class="pin-panel" aria-label="Enter PIN">
        <div id="pin-dots" class="pin-dots" aria-hidden="true"></div>
        <div id="keypad" class="keypad">
          <button type="button" data-digit="1" aria-label="1">1</button>
          <button type="button" data-digit="2" aria-label="2">2</button>
          <button type="button" data-digit="3" aria-label="3">3</button>
          <button type="button" data-digit="4" aria-label="4">4</button>
          <button type="button" data-digit="5" aria-label="5">5</button>
          <button type="button" data-digit="6" aria-label="6">6</button>
          <button type="button" data-digit="7" aria-label="7">7</button>
          <button type="button" data-digit="8" aria-label="8">8</button>
          <button type="button" data-digit="9" aria-label="9">9</button>
          <button
            id="pin-quick-exit"
            class="quick-exit-button"
            type="button"
            aria-label="Quick exit to Google Search"
            title="Quick exit"
          >×</button>
          <button type="button" data-digit="0" aria-label="0">0</button>
          <button type="button" data-action="backspace" aria-label="Delete last digit">⌫</button>
        </div>
      </section>

      <section id="chat-panel" class="chat-panel" aria-label="Conversation" hidden>
        <header class="chat-header">
          <div class="chat-heading">
            <button id="chat-player" class="chat-player" type="button" aria-label="Open chat tools"></button>
            <p id="chat-presence" class="chat-presence" aria-live="polite"></p>
            <p id="chat-stats" class="chat-stats" aria-live="polite"></p>
          </div>
          <div class="chat-header-actions">
            <button
              id="toggle-notifications"
              class="notification-toggle"
              type="button"
              role="switch"
              aria-checked="false"
              aria-label="Push notifications"
            >
              <span class="notification-toggle-label">Push notifications</span>
              <span class="notification-toggle-track" aria-hidden="true">
                <span class="notification-toggle-thumb"></span>
              </span>
            </button>
          </div>
        </header>
        <ol id="messages" class="messages" aria-live="polite" aria-relevant="additions"></ol>
        <p id="typing-indicator" class="typing-indicator" aria-live="polite" hidden></p>
        <section id="reply-preview" class="reply-preview" aria-live="polite" hidden>
          <div>
            <span id="reply-preview-player" class="reply-preview-player"></span>
            <span id="reply-preview-text" class="reply-preview-text"></span>
          </div>
          <button id="cancel-reply" type="button" aria-label="Cancel reply">×</button>
        </section>
        <p id="notification-warning" class="notification-warning" role="status" hidden>
          Di efas baby ko!!! 
         notifications are on · turn them off when you're busy
        </p>
        <form id="message-form" class="message-form">
          <label class="sr-only" for="message">Write a message</label>
          <input id="message" name="message" maxlength="2000" placeholder="Write a message…" />
          <input id="photo-input" class="sr-only" type="file" accept="image/*" multiple />
          <input id="camera-input" class="sr-only" type="file" accept="image/*" capture="environment" />
          <button id="choose-photo" class="photo-button" type="button" aria-label="Choose photos" title="Choose photos">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="4" width="18" height="16" rx="3" />
              <circle cx="8.5" cy="9" r="1.5" />
              <path d="m21 15-5-5L5 20" />
            </svg>
          </button>
          <button id="take-photo" class="photo-button" type="button" aria-label="Take a photo" title="Take a photo">
            <svg class="camera-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v11H3V8a1 1 0 0 1 1-1Z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
            <svg class="send-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M2.4 3.2a.8.8 0 0 0-1.1 1L5 11l9 1-9 1-3.7 6.8a.8.8 0 0 0 1.1 1L23 12 2.4 3.2Z" />
            </svg>
          </button>
        </form>
        <button id="scroll-latest-button" type="button" aria-label="Scroll to latest message" title="Scroll to latest message" aria-hidden="true" tabindex="-1">
          <span aria-hidden="true">↓</span>
        </button>
        <button id="quick-exit" class="quick-exit-button" type="button" aria-label="Quick exit to Google Search" title="Drag to move · click to exit">×</button>
        <section id="chat-tools-page" class="chat-tools-page" aria-label="Chat tools" hidden>
          <header class="chat-tools-header">
            <button id="close-chat-tools" class="photo-album-back" type="button" aria-label="Back to chat">‹</button>
            <div>
              <h2 id="chat-tools-title"></h2>
              <p>Chat tools</p>
            </div>
          </header>
          <div class="chat-tools-actions">
            <button id="open-search" class="chat-tool-action" type="button">
              <span class="chat-tool-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <circle cx="10.8" cy="10.8" r="6.8"></circle>
                  <path d="m16 16 4.5 4.5"></path>
                </svg>
              </span>
              <span>Search messages</span>
            </button>
            <button id="open-photo-album" class="chat-tool-action" type="button">
              <span class="chat-tool-icon chat-tool-icon--photos" aria-hidden="true">▦</span>
              <span>Photos</span>
              <span id="chat-tool-photo-count" class="chat-tool-count"></span>
            </button>
          </div>
        </section>
        <section id="search-page" class="search-page" aria-label="Search messages" hidden>
          <div id="search-toolbar" class="message-tools">
            <label class="sr-only" for="message-search">Search messages</label>
            <input id="message-search" type="search" placeholder="Search messages…" autocomplete="off" />
            <div class="search-result-controls">
              <output id="search-results" class="search-results" aria-live="polite">Search messages</output>
              <button id="previous-search-result" class="search-result-nav" type="button" aria-label="Previous search result" title="Previous result" disabled>↑</button>
              <button id="next-search-result" class="search-result-nav" type="button" aria-label="Next search result" title="Next result" disabled>↓</button>
              <button id="close-search" class="search-result-nav search-close" type="button" aria-label="Close search" title="Close search">×</button>
            </div>
          </div>
          <ol id="search-result-list" class="search-result-list" aria-live="polite"></ol>
        </section>
        <section id="photo-album" class="photo-album" aria-label="Photo album" hidden>
          <header class="photo-album-header">
            <button id="close-photo-album" class="photo-album-back" type="button" aria-label="Back to chat">‹</button>
            <div>
              <h2>Photos</h2>
              <p id="photo-album-count" class="photo-album-count"></p>
            </div>
          </header>
          <div id="photo-album-grid" class="photo-album-grid"></div>
        </section>
        <section id="message-actions" class="message-actions" aria-label="Message actions" hidden>
          <button id="message-actions-backdrop" class="message-actions-backdrop" type="button" aria-label="Close message actions"></button>
          <div class="message-actions-buttons">
            <button id="reply-to-message" type="button">Reply</button>
            <button id="copy-message" type="button">Copy</button>
            <button id="edit-message" type="button" hidden>Edit</button>
          </div>
        </section>
        <section id="photo-review" class="photo-review" aria-label="Review photos" hidden>
          <button id="photo-review-backdrop" class="photo-review-backdrop" type="button" aria-label="Cancel photo attachment"></button>
          <div class="photo-review-card" role="dialog" aria-modal="true" aria-labelledby="photo-review-title">
            <h2 id="photo-review-title">Review photos</h2>
            <div id="photo-review-previews" class="photo-review-previews"></div>
            <div class="photo-review-actions">
              <button id="cancel-photo-review" type="button">Cancel</button>
              <button id="send-photo-review" type="button">Send photos</button>
            </div>
          </div>
        </section>
        <section id="photo-viewer" class="photo-viewer" aria-label="Photo preview" hidden>
          <button id="photo-viewer-backdrop" class="photo-viewer-backdrop" type="button" aria-label="Close photo preview"></button>
          <div class="photo-viewer-card" role="dialog" aria-modal="true" aria-label="Photo preview">
            <button id="close-photo-viewer" class="photo-viewer-close" type="button" aria-label="Close photo preview">×</button>
            <img id="photo-viewer-image" alt="Full-size chat photo" />
            <button id="download-photo" type="button">Download image</button>
          </div>
        </section>
      </section>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
