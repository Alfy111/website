<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123f50" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Freeform" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/volume-alert.svg?v=2" />
    <link rel="apple-touch-icon" href="/icons/volume-alert-192.png" />
    <title>Freeform Chat</title>
  </head>
  <body>
    <main class="chat-shell">
      <section id="pin-panel" class="pin-panel" aria-label="Enter PIN">
        <div id="pin-dots" class="pin-dots" aria-hidden="true"></div>
        <div id="keypad" class="keypad">
          <button type="button" data-digit="1" aria-label="1">1</button>
          <button type="button" data-digit="2" aria-label="2">2</button>
          <button type="button" data-digit="3" aria-label="3">3</button>
          <button type="button" data-digit="4" aria-label="4">4</button>
          <button type="button" data-digit="5" aria-label="5">5</button>
          <button type="button" data-digit="6" aria-label="6">6</button>
          <button type="button" data-digit="7" aria-label="7">7</button>
          <button type="button" data-digit="8" aria-label="8">8</button>
          <button type="button" data-digit="9" aria-label="9">9</button>
          <button
            id="pin-quick-exit"
            class="quick-exit-button"
            type="button"
            aria-label="Quick exit to Google Search"
            title="Quick exit"
          >×</button>
          <button type="button" data-digit="0" aria-label="0">0</button>
          <button type="button" data-action="backspace" aria-label="Delete last digit">⌫</button>
        </div>
      </section>

      <section id="chat-panel" class="chat-panel" aria-label="Conversation" hidden>
        <header class="chat-header">
          <span id="chat-player" class="chat-player"></span>
          <div class="chat-header-actions">
            <button
              id="toggle-notifications"
              class="notification-toggle"
              type="button"
              role="switch"
              aria-checked="false"
              aria-label="Push notifications"
            >
              <span class="notification-toggle-label">Push notifications</span>
              <span class="notification-toggle-track" aria-hidden="true">
                <span class="notification-toggle-thumb"></span>
              </span>
            </button>
            <p id="notification-warning" class="notification-warning" role="status" hidden>
              Push notifications are on. Turn them off when you're busy.
            </p>
          </div>
        </header>
        <ol id="messages" class="messages" aria-live="polite" aria-relevant="additions"></ol>
        <p id="typing-indicator" class="typing-indicator" aria-live="polite" hidden></p>
        <form id="message-form" class="message-form">
          <label class="sr-only" for="message">Write a message</label>
          <input id="message" name="message" maxlength="2000" placeholder="Write a message…" />
          <input id="photo-input" class="sr-only" type="file" accept="image/*" multiple />
          <input id="camera-input" class="sr-only" type="file" accept="image/*" capture="environment" />
          <button id="choose-photo" class="photo-button" type="button" aria-label="Choose photos" title="Choose photos">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="4" width="18" height="16" rx="3" />
              <circle cx="8.5" cy="9" r="1.5" />
              <path d="m21 15-5-5L5 20" />
            </svg>
          </button>
          <button id="take-photo" class="photo-button" type="button" aria-label="Take a photo" title="Take a photo">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v11H3V8a1 1 0 0 1 1-1Z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </button>
          <button id="quick-exit" class="quick-exit-button" type="button" aria-label="Quick exit to Google Search" title="Quick exit">×</button>
        </form>
        <button id="scroll-latest-button" type="button" aria-label="Scroll to latest message" title="Scroll to latest message" hidden>
          <span aria-hidden="true">↓</span>
        </button>
      </section>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
